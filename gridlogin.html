<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body>
    <h2 class="text-center">Login</h2>
    <div class="row">
        <div class="col-4"></div>
        <div class="col-4 ">
            <div class="container ms-5">
                <img width="50%" src="https://cdn-icons-png.flaticon.com/512/6681/6681204.png" alt="">
            </div>
            
        </div>
        <div class="col-4">

        </div>
    </div>
    <div class="container border border-2 border-dark">
        <div class="row ">
            <div class="col-6">
                <img width="100%" src="https://img.freepik.com/free-vector/login-concept-illustration_114360-739.jpg"
                    alt="">
            </div>
            <div class="col-6">
                <div class="container text-center p-5 mt-5  w-75">
                    <h1 class="text-info fw-bolder fs-1">Login</h1>
                    <input class="form-control" type="text" placeholder="Username">
                    <input class="form-control" type="password" placeholder="password">
                    <div class="d-grid">
                        <button class="btn btn-success" type="submit">Submit</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>

</html>
