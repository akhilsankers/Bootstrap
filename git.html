<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

</head>

<body>
    <div class="text-center">
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
            class="rounded mx-auto d-block mt-3" style="width: 150px" alt="...">
    </div>
    <h1 class="text-secondary fs-1 text-center mb-3">Sign in to GitHub</h1>
    <div class="container  border-dark  rounded" style="background-color: rgb(209, 209, 209); width: 400px;">

        <div class="mb-3 mt-4">
            <label for="exampleFormControlInput1" class="form-label mt-3">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="Email">
        </div>
        <div class="mb-3 mt-4">
            <label for="inputPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="inputPassword" placeholder="password">
        </div>
        <div class="d-grid mb-3">
            <button class="btn btn-success mb-4" type="button">Button</button>
        </div>
    </div>
    <div class="container mt-5  border border-dark border-1 rounded-4 " style=" width: 400px;">
        <p class="text-center mt-3 mb-3"><span class="text-secondary">New to GitHub?</span><a href="">Create an account.</a></p>
    </div>
    <div class=" mt-4 text-center">
        <a class="me-3 " href="" style="text-decoration: none;">Tearms</a>
        <a class="me-3 " href="" style="text-decoration: none;">Privacy</a>
        <a class="me-3 " href="" style="text-decoration: none;">Security</a>
        <a class="me-3 "href="" style="text-decoration: none;">contact</a>
    </div>
</body>
